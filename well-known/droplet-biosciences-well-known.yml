note: >-
  Every RFC 8615 /.well-known/ path probed on the company's only live host returns 404,
  so NO WellKnown or SecurityTxt pointer is emitted in apis.yml — this section records a
  verified ABSENCE. That is NOT the whole story, however. dropletbiosci.com is a WordPress
  site (Kinsta / Cloudflare) whose core REST API is live and anonymously readable at
  /wp-json/, and it additionally exposes an OAuth 2.0 authorization server and three
  Model Context Protocol endpoints at non-standard, plugin-provided paths under /wp-json/.
  Those are recorded under discovered_surfaces below and captured as first-class artifacts
  in mcp/, authentication/, scopes/ and conventions/. A prior enrichment round probed only
  the site root and concluded "no machine-readable interface"; that conclusion was wrong and
  is superseded by this file.
