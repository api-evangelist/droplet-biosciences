note: 'Droplet Biosciences serves three live Model Context Protocol endpoints from its own host, dropletbiosci.com.
  They are REAL — the namespace index is anonymous and each endpoint answers JSON-RPC — but they are NOT
  a Droplet product API. They are emitted by the WordPress MCP Adapter and by two booking/events plugins
  running on the company''s marketing site, so their tool surface concerns events, bookings and site content,
  not the LymphDetect diagnostic service. Recorded here because the endpoints genuinely exist and an agent
  can reach them; read this file before treating Droplet as an MCP-enabled diagnostics vendor. No tool
  list is recorded: every tools/list call returns 401 and NO tool names have been published anywhere,
  so nothing is derived or guessed.'
