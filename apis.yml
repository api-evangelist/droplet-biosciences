apis:
- name: Droplet Biosciences WordPress REST API
  description: 'The WordPress core REST API served from the company''s marketing site.
    It is live, anonymous for published content, and self-describing: the discovery
    document at /wp-json/ lists 472 routes across 19 namespaces, and the wp/v2 namespace
    (138 routes) serves Droplet''s own content including the custom post types publications,
    press-releases and team. This is a CMS default surface, NOT a Droplet product API
    — there is no documentation, no portal, no plan, no support channel and no versioning
    or deprecation policy attached to it. It is catalogued because it genuinely exists
    and an agent can call it. The same host also exposes an OAuth 2.0 authorization
    server and three Model Context Protocol endpoints under /wp-json/, which are gated
    and covered by the artifacts below.'
