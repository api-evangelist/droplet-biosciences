aid: droplet-biosciences
name: Droplet Biosciences
description: 'Droplet Biosciences is a Cambridge, Massachusetts clinical-stage molecular
  diagnostics company, founded in 2021 by physician scientists and backed by The Engine
  Ventures, that has pioneered a lymph liquid biopsy platform for detecting molecular
  residual disease after cancer surgery. Rather than sampling blood, Droplet stabilizes
  and extracts lymphatic fluid from routine post-surgical drain material through a
  proprietary isolation process, yielding an analyte source in which circulating tumor
  DNA is present at substantially higher levels than in matched plasma. Its lead test,
  LymphDetect, is an ultra-sensitive tumor-informed ctDNA assay initially targeting
  HPV-independent head and neck squamous cell carcinoma, run out of the company''s
  own CLIA-licensed laboratory. Droplet is a laboratory and assay company, not a software
  vendor: it publishes no developer program, no documentation, no SDK and no OpenAPI.
  The machine-readable endpoints catalogued here are not a product API — they are the
  WordPress REST API, an OAuth 2.0 authorization server and three Model Context Protocol
  endpoints emitted by plugins on the company''s marketing site, all found live and
  callable on dropletbiosci.com during contract discovery on 2026-08-12.'
