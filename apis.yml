x-enrichment-note: >-
  Supersedes the earlier 2026-08-12 pass that recorded status minimal / x-coverage
  none:no-developer-program. That pass probed only the site root and concluded there was
  no machine-readable interface. Contract discovery against /wp-json/ found a live
  anonymous REST API, an OAuth 2.0 authorization server with PKCE and open dynamic client
  registration, and three MCP endpoints. The x-coverage block has been removed because
  the profile is no longer thin — but note that Droplet still has NO developer program,
  and the surfaces found are CMS/plugin byproducts rather than a product API. Read
  mcp/droplet-biosciences-mcp.yml and well-known/droplet-biosciences-well-known.yml before
  treating Droplet Biosciences as an API provider. No WellKnown, SecurityTxt, AgentCard,
  Idempotency, SDKs, StatusPage, Deprecation, Security or TrustCenter pointer is emitted:
  every one of those probes returned a verified miss.
